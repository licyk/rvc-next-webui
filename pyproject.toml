[build-system]
requires = ["setuptools", "pip", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvc-next-webui"
description = "RVC Next WebUI 启动器"
requires-python = ">=3.10"
readme = { content-type = "text/markdown", file = "README.md" }
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["version", "dependencies"]
authors = [ {name = "licyk"} ]

[tool.setuptools.packages.find]
where = ["."]
include = ["rvc_next_webui*"]
exclude = ["tests*", "docs*", "*__pycache__*", "*.pyc", "*.pyo", "*.pyd", ".git*", "__pycache__"]
namespaces = true

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", "*.pyo", "*.pyd", ".git*", ".github*", "tests*", "docs*"]

[tool.setuptools.dynamic]
version = { attr = "rvc_next_webui.version.VERSION" }
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 140
target-version = "py310"
lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.10"
